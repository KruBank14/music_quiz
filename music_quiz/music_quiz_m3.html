<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมดนตรี ม.3 | บ้านคลอง 14</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d1a;
    --surface: #161628;
    --surface2: #1e1e38;
    --c1: #c77dff;
    --c2: #e0aaff;
    --text: #f0eeff;
    --text-muted: #8b8aaa;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Mitr',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(247,201,72,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 15%, rgba(78,205,196,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 80%, rgba(167,139,250,0.3) 0%, transparent 100%);
    pointer-events:none; z-index:0;
  }
  .screen { position:relative; z-index:1; display:none; }
  .screen.active { display:flex; }

  /* HOME */
  #home {
    flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:1.5rem; gap:1.5rem;
  }
  .logo-area { text-align:center; animation:floatIn .8s ease both; }
  .logo-icon { font-size:3.5rem; display:block; margin-bottom:.4rem; animation:float 4s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-8px) rotate(3deg)} }
  @keyframes floatIn { from{opacity:0;transform:translateY(-25px)} to{opacity:1;transform:translateY(0)} }
  .grade-badge {
    display:inline-block;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    color:#0d0d1a; font-weight:700; font-size:1rem;
    padding:.25rem 1rem; border-radius:100px; margin-bottom:.5rem;
  }
  .logo-area h1 {
    font-size:clamp(1.4rem,5vw,2.4rem); font-weight:700;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .logo-area .subtitle { font-size:.85rem; color:var(--text-muted); margin-top:.3rem; font-family:'Sarabun',sans-serif; }
  .categories-grid {
    display:grid; grid-template-columns:repeat(2,1fr); gap:.9rem;
    width:100%; max-width:600px; animation:floatIn .8s .2s ease both;
  }
  .cat-card {
    background:var(--surface); border:2px solid transparent;
    border-radius:1.2rem; padding:1.2rem .9rem; text-align:center;
    cursor:pointer; transition:all .3s ease; position:relative; overflow:hidden;
  }
  .cat-card:nth-child(1) { border-color:rgba(247,201,72,.3); }
  .cat-card:nth-child(1):hover { border-color:#f7c948; box-shadow:0 8px 28px rgba(247,201,72,.25); transform:translateY(-4px); }
  .cat-card:nth-child(2) { border-color:rgba(255,107,107,.3); }
  .cat-card:nth-child(2):hover { border-color:#ff6b6b; box-shadow:0 8px 28px rgba(255,107,107,.25); transform:translateY(-4px); }
  .cat-card:nth-child(3) { border-color:rgba(78,205,196,.3); }
  .cat-card:nth-child(3):hover { border-color:#4ecdc4; box-shadow:0 8px 28px rgba(78,205,196,.25); transform:translateY(-4px); }
  .cat-card:nth-child(4) { border-color:rgba(167,139,250,.3); }
  .cat-card:nth-child(4):hover { border-color:#a78bfa; box-shadow:0 8px 28px rgba(167,139,250,.25); transform:translateY(-4px); }
  .cat-icon { font-size:2rem; display:block; margin-bottom:.4rem; }
  .cat-name { font-size:.9rem; font-weight:600; line-height:1.3; }
  .cat-count { font-size:.72rem; color:var(--text-muted); margin-top:.2rem; }
  .btn-all {
    background:linear-gradient(135deg,var(--c1),var(--c2));
    color:#0d0d1a; border:none; padding:.85rem 2.5rem;
    border-radius:100px; font-size:1rem; font-family:'Mitr',sans-serif;
    font-weight:600; cursor:pointer; transition:all .3s;
    animation:floatIn .8s .4s ease both;
  }
  .btn-all:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(247,201,72,.35); }
  .nav-grades {
    display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center;
    max-width:600px; animation:floatIn .8s .5s ease both;
  }
  .nav-link {
    background:var(--surface); border:1px solid rgba(255,255,255,.1);
    color:var(--text-muted); padding:.35rem .85rem; border-radius:100px;
    font-size:.78rem; cursor:pointer; text-decoration:none;
    transition:all .2s; font-family:'Mitr',sans-serif;
  }
  .nav-link.active { background:linear-gradient(135deg,var(--c1),var(--c2)); color:#0d0d1a; font-weight:700; border-color:transparent; }
  .nav-link:hover:not(.active) { border-color:rgba(255,255,255,.3); color:var(--text); }

  /* QUIZ */
  #quiz {
    flex-direction:column; min-height:100vh;
    padding:1.2rem; gap:1rem; max-width:680px; margin:0 auto; width:100%;
  }
  .quiz-header { display:flex; align-items:center; justify-content:space-between; gap:.8rem; }
  .btn-back {
    background:var(--surface); border:1px solid rgba(255,255,255,.1);
    color:var(--text); width:2.3rem; height:2.3rem; border-radius:50%;
    font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .2s; flex-shrink:0;
  }
  .btn-back:hover { background:var(--surface2); }
  .quiz-meta { flex:1; text-align:center; }
  .quiz-cat-label { font-size:.75rem; color:var(--text-muted); font-family:'Sarabun',sans-serif; }
  .quiz-counter { font-size:.95rem; font-weight:600; }
  .score-badge {
    background:var(--surface); border:1px solid rgba(255,255,255,.1);
    border-radius:100px; padding:.25rem .8rem; font-size:.82rem; font-weight:600;
  }
  .progress-bar-wrap { background:var(--surface); border-radius:100px; height:7px; overflow:hidden; }
  .progress-bar-fill {
    height:100%; border-radius:100px;
    background:linear-gradient(90deg,var(--c1),var(--c2));
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .question-card {
    background:var(--surface); border-radius:1.4rem; padding:1.5rem;
    border:1px solid rgba(255,255,255,.07); position:relative; overflow:hidden;
  }
  .question-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:1.4rem 1.4rem 0 0;
  }
  .qc1::before { background:linear-gradient(90deg,#f7c948,transparent); }
  .qc2::before { background:linear-gradient(90deg,#ff6b6b,transparent); }
  .qc3::before { background:linear-gradient(90deg,#4ecdc4,transparent); }
  .qc4::before { background:linear-gradient(90deg,#a78bfa,transparent); }
  .question-emoji { font-size:1.9rem; display:block; margin-bottom:.5rem; }
  .question-num { font-size:.72rem; color:var(--text-muted); margin-bottom:.4rem; font-family:'Sarabun',sans-serif; }
  .question-text { font-size:clamp(.95rem,2.8vw,1.15rem); font-weight:500; line-height:1.6; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:.65rem; }
  @media(max-width:440px) { .choices { grid-template-columns:1fr; } }
  .choice-btn {
    background:var(--surface); border:2px solid rgba(255,255,255,.1); color:var(--text);
    padding:.8rem .9rem; border-radius:.9rem; font-family:'Mitr',sans-serif; font-size:.87rem;
    cursor:pointer; text-align:left; transition:all .2s;
    display:flex; align-items:center; gap:.55rem; line-height:1.4;
  }
  .choice-btn:hover:not(:disabled) { background:var(--surface2); border-color:rgba(255,255,255,.25); transform:translateX(3px); }
  .choice-label {
    width:1.55rem; height:1.55rem; border-radius:50%; background:var(--surface2);
    display:flex; align-items:center; justify-content:center;
    font-size:.72rem; font-weight:700; flex-shrink:0; transition:all .2s;
  }
  .choice-btn.correct { background:rgba(78,205,100,.18); border-color:#4ecd64; color:#7ee89a; }
  .choice-btn.correct .choice-label { background:#4ecd64; color:#0d0d1a; }
  .choice-btn.wrong { background:rgba(255,107,107,.13); border-color:rgba(255,107,107,.5); color:rgba(255,107,107,.85); }
  .choice-btn.wrong .choice-label { background:rgba(255,107,107,.5); }
  .choice-btn:disabled { cursor:default; }
  @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .feedback-bar {
    padding:.9rem 1.1rem; border-radius:.9rem; font-size:.9rem; font-weight:500;
    display:none; align-items:center; gap:.65rem; animation:slideUp .3s ease;
  }
  .feedback-bar.show { display:flex; }
  .correct-fb { background:rgba(78,205,100,.13); border:1px solid rgba(78,205,100,.3); color:#7ee89a; }
  .wrong-fb { background:rgba(255,107,107,.1); border:1px solid rgba(255,107,107,.23); color:#ff9999; }
  .feedback-icon { font-size:1.3rem; }
  .feedback-explanation { font-family:'Sarabun',sans-serif; font-size:.82rem; color:var(--text-muted); margin-top:.2rem; }
  .btn-next {
    background:linear-gradient(135deg,var(--c1),var(--c2)); color:#0d0d1a;
    border:none; padding:.85rem; border-radius:.9rem; font-size:.95rem;
    font-family:'Mitr',sans-serif; font-weight:600; cursor:pointer;
    transition:all .3s; display:none; width:100%;
  }
  .btn-next.show { display:block; }
  .btn-next:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(247,201,72,.3); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .shake { animation:shake .35s ease; }

  /* RESULT */
  #result {
    flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:1.5rem; gap:1.2rem;
    max-width:560px; margin:0 auto; width:100%;
  }
  .result-trophy { font-size:4.5rem; animation:bounce .6s ease; }
  @keyframes bounce { 0%{transform:scale(0)} 60%{transform:scale(1.15)} 80%{transform:scale(.95)} 100%{transform:scale(1)} }
  .result-title {
    font-size:clamp(1.5rem,5vw,2.2rem); font-weight:700; text-align:center;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .result-score-ring { position:relative; width:130px; height:130px; }
  .result-score-ring svg { transform:rotate(-90deg); }
  .ring-bg { fill:none; stroke:var(--surface2); stroke-width:8; }
  .ring-fill { fill:none; stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1); }
  .ring-text { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:700; }
  .ring-num { font-size:1.9rem; line-height:1; }
  .ring-denom { font-size:.75rem; color:var(--text-muted); }
  .result-grade {
    background:var(--surface); border-radius:1.3rem; padding:1.1rem 1.8rem;
    text-align:center; border:1px solid rgba(255,255,255,.07); width:100%;
  }
  .grade-letter { font-size:1.9rem; font-weight:700; }
  .grade-msg { font-family:'Sarabun',sans-serif; color:var(--text-muted); font-size:.88rem; margin-top:.25rem; }
  .result-actions { display:flex; gap:.65rem; width:100%; flex-wrap:wrap; }
  .btn-secondary {
    flex:1; min-width:110px; background:var(--surface);
    border:1px solid rgba(255,255,255,.12); color:var(--text);
    padding:.75rem; border-radius:.9rem; font-family:'Mitr',sans-serif;
    font-size:.88rem; cursor:pointer; transition:all .2s;
  }
  .btn-secondary:hover { background:var(--surface2); }
  .btn-primary {
    flex:1; min-width:110px;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    border:none; color:#0d0d1a; padding:.75rem; border-radius:.9rem;
    font-family:'Mitr',sans-serif; font-size:.88rem; font-weight:600;
    cursor:pointer; transition:all .2s;
  }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(247,201,72,.3); }
  .confetti-piece {
    position:fixed; width:8px; height:11px; border-radius:2px; top:-20px;
    animation:confettiFall linear forwards; z-index:999; pointer-events:none;
  }
  @keyframes confettiFall { to{transform:translateY(110vh) rotate(720deg); opacity:0;} }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">

  <div class="categories-grid">

    <div class="cat-card" onclick="startQuiz('2')"><span class="cat-icon">🥁</span><div class="cat-name">ทฤษฎีดนตรีขั้นสูงสุด</div><div class="cat-count">5 ข้อ</div></div>

    <a class="nav-link " href="music_quiz_p5.html">ป.5</a>

    <a class="nav-link " href="music_quiz_m1.html">ม.1</a>

</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <button class="btn-back" onclick="goHome()">←</button>

      <div class="quiz-cat-label" id="catLabel"></div>

    <svg width="130" height="130" viewBox="0 0 130 130">
      <circle class="ring-bg" cx="65" cy="65" r="54"/>
      <circle class="ring-fill" id="ringFill" cx="65" cy="65" r="54"
        stroke="url(#rg)" stroke-dasharray="339.29" stroke-dashoffset="339.29"/>
      <defs><linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">

<script>
const QUESTIONS = {"1": [{"q": "Gamelan เป็นดนตรีของประเทศใด?", "emoji": "🌏", "choices": ["ไทย", "อินเดีย", "อินโดนีเซีย", "ญี่ปุ่น"], "ans": 2, "explain": "Gamelan เป็นวงดนตรีดั้งเดิมของอินโดนีเซีย ประกอบด้วยระฆัง ฆ้อง และกลอง"}, {"q": "Raga เป็นระบบดนตรีของ?", "emoji": "🎵", "choices": ["จีน", "อินเดีย", "อาหรับ", "แอฟริกา"], "ans": 1, "explain": "Raga เป็นระบบทำนองในดนตรีคลาสสิกอินเดีย แต่ละ Raga มีเวลาและอารมณ์เฉพาะ"}, {"q": "Flamenco เป็นดนตรีของ?", "emoji": "💃", "choices": ["ฝรั่งเศส", "อิตาลี", "สเปน", "โปรตุเกส"], "ans": 2, "explain": "ฟลาเมงโกเป็นศิลปะดนตรีและการเต้นรำของสเปน มีต้นกำเนิดจากแคว้นอันดาลูเซีย"}, {"q": "Samba เป็นดนตรีของ?", "emoji": "🎺", "choices": ["อาร์เจนตินา", "คิวบา", "บราซิล", "เม็กซิโก"], "ans": 2, "explain": "ซัมบ้าเป็นดนตรีและการเต้นรำของบราซิล นิยมเล่นในช่วงเทศกาลคาร์นิวัล"}, {"q": "K-Pop มีต้นกำเนิดจาก?", "emoji": "🎤", "choices": ["ญี่ปุ่น", "จีน", "เกาหลีใต้", "ไต้หวัน"], "ans": 2, "explain": "K-Pop (Korean Pop) เป็นดนตรีป๊อปจากเกาหลีใต้ที่แพร่หลายไปทั่วโลก"}], "2": [{"q": "Modal System ใช้ใน?", "emoji": "🎼", "choices": ["ดนตรีป๊อปเท่านั้น", "ดนตรียุคกลางและแจ๊สสมัยใหม่", "ดนตรีเด็ก", "ดนตรีอิเล็กทรอนิก"], "ans": 1, "explain": "Modal System มีต้นกำเนิดในยุคกลาง และถูกนำกลับมาใช้ในแจ๊สสมัยใหม่"}, {"q": "Atonal Music คือ?", "emoji": "🎵", "choices": ["ดนตรีที่ไม่มีเสียง", "ดนตรีที่ไม่ยึดคีย์หรือบันไดเสียงใด", "ดนตรีช้ามาก", "ดนตรีเร็วมาก"], "ans": 1, "explain": "Atonal Music คือดนตรีที่ไม่ยึดติดกับ Tonal Center หรือบันไดเสียงแบบดั้งเดิม"}, {"q": "Twelve-Tone Technique พัฒนาโดย?", "emoji": "12", "choices": ["บีโธเฟน", "โมสาร์ท", "Arnold Schoenberg", "บาค"], "ans": 2, "explain": "Arnold Schoenberg พัฒนาเทคนิค 12 Tone ที่ใช้ทุกโน้ตใน Chromatic Scale อย่างเท่าเทียม"}, {"q": "Minimalism ในดนตรีคือ?", "emoji": "➖", "choices": ["ดนตรีที่มีเสียงมาก", "ดนตรีที่ใช้องค์ประกอบซ้ำ ๆ เรียบง่าย", "ดนตรีที่ซับซ้อน", "ดนตรีดัง"], "ans": 1, "explain": "Minimalism ใช้รูปแบบซ้ำ ๆ ที่เรียบง่ายและค่อย ๆ เปลี่ยนแปลงทีละน้อย"}, {"q": "Microtonal Music คือ?", "emoji": "🔬", "choices": ["ดนตรีเสียงเบามาก", "ดนตรีที่ใช้ช่วงเสียงเล็กกว่าครึ่งเสียง", "ดนตรีเร็วมาก", "ดนตรีสำหรับเด็ก"], "ans": 1, "explain": "Microtonal Music ใช้ช่วงเสียงที่เล็กกว่าครึ่งเสียง พบในดนตรีอาหรับ อินเดีย และร่วมสมัย"}], "3": [{"q": "นักดนตรีวิชาการที่ศึกษาประวัติดนตรีเรียกว่า?", "emoji": "📚", "choices": ["นักดนตรี", "นักวิชาการดนตรี (Musicologist)", "วาทยากร", "นักร้อง"], "ans": 1, "explain": "Musicologist คือนักวิชาการที่ศึกษาประวัติศาสตร์และทฤษฎีดนตรีเชิงวิชาการ"}, {"q": "การศึกษาดนตรีช่วยพัฒนา?", "emoji": "🧠", "choices": ["ร่างกายเท่านั้น", "สมอง ทักษะการฟัง และวินัย", "ความแข็งแรง", "ความเร็ว"], "ans": 1, "explain": "การเรียนดนตรีพัฒนาสมองทั้งสองซีก เพิ่มทักษะการฟัง คณิตศาสตร์ และวินัย"}, {"q": "Studio Recording Engineer ทำหน้าที่?", "emoji": "🎚️", "choices": ["แต่งเพลง", "ร้องเพลง", "ควบคุมและบันทึกเสียงในสตูดิโอ", "สอนดนตรี"], "ans": 2, "explain": "Recording Engineer ควบคุมอุปกรณ์บันทึกเสียง ปรับ EQ และ Balance เพื่อให้ได้เสียงที่ดีที่สุด"}, {"q": "Music Therapist ต้องมีความรู้ด้านใดบ้าง?", "emoji": "💊", "choices": ["ดนตรีเท่านั้น", "การแพทย์เท่านั้น", "ทั้งดนตรีและจิตวิทยา/การแพทย์", "กฎหมาย"], "ans": 2, "explain": "นักดนตรีบำบัดต้องรู้ทั้งดนตรีและศาสตร์สุขภาพจิต เพื่อออกแบบการบำบัดได้เหมาะสม"}, {"q": "Ethnomusicology ศึกษาเกี่ยวกับ?", "emoji": "🌍", "choices": ["ดนตรีคลาสสิกตะวันตก", "ดนตรีในบริบทวัฒนธรรมและสังคม", "ทฤษฎีดนตรีล้วน", "การแต่งเพลง"], "ans": 1, "explain": "Ethnomusicology ศึกษาดนตรีในฐานะปรากฏการณ์ทางวัฒนธรรมและสังคม"}], "4": [{"q": "MIDI ย่อมาจาก?", "emoji": "🔌", "choices": ["Music In Digital Interface", "Musical Instrument Digital Interface", "Modern Instrument Design Integration", "Music Identification Digital Index"], "ans": 1, "explain": "MIDI ย่อมาจาก Musical Instrument Digital Interface มาตรฐานการสื่อสารระหว่างเครื่องดนตรีดิจิทัล"}, {"q": "Synthesizer คือ?", "emoji": "🎹", "choices": ["เครื่องดนตรีอะคูสติก", "เครื่องสร้างเสียงด้วยไฟฟ้า", "กลองอะคูสติก", "ไวโอลิน"], "ans": 1, "explain": "Synthesizer คือเครื่องดนตรีอิเล็กทรอนิกส์ที่สร้างเสียงด้วยวงจรไฟฟ้าหรือซอฟต์แวร์"}, {"q": "Streaming ในวงการดนตรีเปลี่ยนแปลงอุตสาหกรรมดนตรีอย่างไร?", "emoji": "📱", "choices": ["ไม่มีผล", "ทำให้ฟังเพลงออนไลน์ได้ทุกที่แทน CD/เทป", "ทำให้ดนตรีหายไป", "เพิ่มยอดขาย CD"], "ans": 1, "explain": "Streaming เปลี่ยนรูปแบบการบริโภคดนตรีจาก Physical Media มาสู่การสตรีมออนไลน์"}, {"q": "AI ถูกนำมาใช้ในดนตรีอย่างไร?", "emoji": "🤖", "choices": ["ไม่ได้ใช้", "แต่งเพลง สร้างเสียง และวิเคราะห์ดนตรี", "เล่นคอนเสิร์ต", "สอนดนตรีเท่านั้น"], "ans": 1, "explain": "AI ถูกนำมาใช้ในการแต่งเพลง สร้างเสียง แนะนำเพลง และวิเคราะห์รูปแบบดนตรี"}, {"q": "NFT ในวงการดนตรีคือ?", "emoji": "🎨", "choices": ["รูปแบบโน้ต", "สินทรัพย์ดิจิทัลที่แสดงความเป็นเจ้าของเพลง", "เครื่องดนตรีใหม่", "ระบบฟังเพลง"], "ans": 1, "explain": "NFT (Non-Fungible Token) ในดนตรีช่วยให้ศิลปินขายผลงานดิจิทัลและสิทธิ์ความเป็นเจ้าของ"}]};
const CAT_NAMES = {"1": "ดนตรีและวัฒนธรรมโลก", "2": "ทฤษฎีดนตรีขั้นสูงสุด", "3": "อาชีพและการศึกษาดนตรี", "4": "เทคโนโลยีดนตรี"};
const CAT_ACCENTS = {"1":"qc1","2":"qc2","3":"qc3","4":"qc4"};

let currentQuestions=[],currentIndex=0,score=0,answered=false,currentCat="";

function shuffle(arr){return[...arr].sort(()=>Math.random()-.5);}

function startQuiz(cat){
  currentCat=cat; score=0; currentIndex=0; answered=false;
  if(cat==='all'){
    let all=[];
    Object.keys(QUESTIONS).forEach(c=>{all=all.concat(QUESTIONS[c].map(q=>(({...q,cat:c}))));});
    currentQuestions=shuffle(all);
  }else{
    currentQuestions=shuffle(QUESTIONS[cat]).map(q=>(({...q,cat})));
  }
  showScreen('quiz'); renderQuestion();
}

function renderQuestion(){
  const q=currentQuestions[currentIndex],total=currentQuestions.length,cat=q.cat;
  document.getElementById('catLabel').textContent=CAT_NAMES[cat];
  document.getElementById('questionCounter').textContent=`ข้อ ${currentIndex+1} / ${total}`;
  document.getElementById('scoreBadge').textContent=`⭐ ${score}`;
  document.getElementById('progressBar').style.width=`${(currentIndex/total)*100}%`;
  const card=document.getElementById('questionCard');
  card.className=`question-card ${CAT_ACCENTS[cat]}`;
  document.getElementById('questionEmoji').textContent=q.emoji;
  document.getElementById('questionNum').textContent=`หมวด: ${CAT_NAMES[cat]}`;
  document.getElementById('questionText').textContent=q.q;
  const labels=['ก','ข','ค','ง'],choicesEl=document.getElementById('choices');
  choicesEl.innerHTML='';
  q.choices.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML=`<span class="choice-label">${labels[i]}</span>${c}`;
    btn.onclick=()=>selectAnswer(i);
    choicesEl.appendChild(btn);
  });
  document.getElementById('feedbackBar').className='feedback-bar';
  document.getElementById('btnNext').className='btn-next';
  answered=false;
}

function selectAnswer(idx){
  if(answered)return; answered=true;
  const q=currentQuestions[currentIndex];
  const btns=document.querySelectorAll('.choice-btn');
  btns.forEach((btn,i)=>{
    btn.disabled=true;
    if(i===q.ans)btn.classList.add('correct');
    else if(i===idx&&idx!==q.ans)btn.classList.add('wrong');
  });
  const correct=idx===q.ans;
  if(correct){score++;document.getElementById('scoreBadge').textContent=`⭐ ${score}`;}
  const fb=document.getElementById('feedbackBar');
  fb.className=`feedback-bar ${correct?'correct-fb':'wrong-fb'} show`;
  document.getElementById('feedbackIcon').textContent=correct?'✅':'❌';
  document.getElementById('feedbackText').textContent=correct?'ถูกต้อง! เก่งมาก':`ผิด! คำตอบที่ถูกคือ "${q.choices[q.ans]}"`;
  document.getElementById('feedbackExplain').textContent=q.explain;
  if(!correct)btns[idx].classList.add('shake');
  document.getElementById('btnNext').className='btn-next show';
}

function nextQuestion(){
  currentIndex++;
  if(currentIndex>=currentQuestions.length)showResult();
  else renderQuestion();
}

function showResult(){
  showScreen('result');
  const total=currentQuestions.length,pct=score/total;
  let trophy,title,grade,msg,color;
  if(pct>=.9){trophy='🏆';title='ยอดเยี่ยมมาก!';grade='A';msg='เก่งมาก คุณเป็นนักดนตรีตัวยง!';color='#c77dff';}
  else if(pct>=.7){trophy='🥈';title='ดีมาก!';grade='B';msg='ทำได้ดี ลองทบทวนส่วนที่ผิดด้วยนะ';color='#e0aaff';}
  else if(pct>=.5){trophy='🥉';title='ผ่าน!';grade='C';msg='พอใช้ได้ ลองฝึกฝนอีกนะ';color='#a78bfa';}
  else{trophy='📚';title='ลองใหม่!';grade='D';msg='ต้องทบทวนเพิ่มเติมอีกหน่อย';color='#ff6b6b';}
  document.getElementById('resultTrophy').textContent=trophy;
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('ringNum').textContent=score;
  document.getElementById('ringDenom').textContent=`/ ${total}`;
  document.getElementById('gradeLetter').textContent=grade;
  document.getElementById('gradeLetter').style.color=color;
  document.getElementById('gradeMsg').textContent=msg;
  const circ=339.29,offset=circ-(pct*circ);
  setTimeout(()=>document.getElementById('ringFill').style.strokeDashoffset=offset,300);
  if(pct>=.7)spawnConfetti();
}

function spawnConfetti(){
  const colors=['#c77dff','#e0aaff','#4ecdc4','#a78bfa','#fff'];
  for(let i=0;i<55;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='confetti-piece';
      el.style.cssText=`left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.5}s;transform:rotate(${Math.random()*360}deg)`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),4000);
    },i*25);
  }
}

function replayQuiz(){startQuiz(currentCat);}
function goHome(){showScreen('home');}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
</script>
</body>
</html>
